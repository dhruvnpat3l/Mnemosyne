<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }} | Pandora</title>
    <meta name="description" content="{{ site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header>
      <a class="brand" href="{{ '/' | relative_url }}">Pandora <span>by Zendacros</span></a>
      <nav aria-label="Legal documents">
        <a href="{{ '/privacy-policy/' | relative_url }}"{% if page.permalink == '/privacy-policy/' %} aria-current="page"{% endif %}>Privacy Policy</a>
        <a href="{{ '/terms-and-conditions/' | relative_url }}"{% if page.permalink == '/terms-and-conditions/' %} aria-current="page"{% endif %}>Terms and Conditions</a>
        <a href="{{ '/third-party-policy/' | relative_url }}"{% if page.permalink == '/third-party-policy/' %} aria-current="page"{% endif %}>Third-party Licenses</a>
      </nav>
    </header>
    <main id="content">{{ content }}</main>
    <footer>Pandora · Published by Zendacros</footer>
  </body>
</html>
