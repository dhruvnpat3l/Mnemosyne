<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title != site.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 64x64" href="{{ '/assets/favicon.ico' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32x32.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body{% if page.license_page %} class="page-licenses"{% endif %}>
    <a class="skip-link" href="#content">Skip to content</a>
    <header>
      <a class="brand" href="{{ '/' | relative_url }}">
        <img class="brand-logo" src="{{ '/assets/logo.png' | relative_url }}" alt="" width="64" height="64">
        <span class="brand-name">{{ site.title | escape }} <span class="brand-publisher">by Zendacros</span></span>
      </a>
      <nav class="site-nav" aria-label="Legal documents">
        <a href="{{ '/privacy-policy/' | relative_url }}"{% if page.permalink == '/privacy-policy/' %} aria-current="page"{% endif %}>Privacy Policy</a>
        <a href="{{ '/terms-and-conditions/' | relative_url }}"{% if page.permalink == '/terms-and-conditions/' %} aria-current="page"{% endif %}>Terms and Conditions</a>
        <a href="{{ '/third-party-policy/' | relative_url }}"{% if page.permalink == '/third-party-policy/' %} aria-current="page"{% endif %}>Third-party Licenses</a>
      </nav>
    </header>
    <main id="content">{{ content }}</main>
    <footer>{{ site.title | escape }} · Published by Zendacros</footer>
  </body>
</html>
